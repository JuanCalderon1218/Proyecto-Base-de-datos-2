<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | Detector NoSQL</title>

    <link
        rel="stylesheet"
        href="/static/css/styles.css"
    >
</head>

<body class="login-body">

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                DA
            </div>

            <h1>Detector de Anomalías</h1>

            <p class="login-description">
                Plataforma de monitoreo de operaciones NoSQL
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">
                        Usuario
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        required
                        autocomplete="username"
                        placeholder="Ingrese su usuario"
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                        autocomplete="current-password"
                        placeholder="Ingrese su contraseña"
                    >
                </div>

                <div
                    id="loginError"
                    class="error-message"
                ></div>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Iniciar sesión
                </button>

            </form>

        </section>

    </main>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/login.js"></script>

</body>
</html>
