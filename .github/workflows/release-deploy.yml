name: Release y despliegue Render

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version del release (ejemplo: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release-deploy:
    name: Crear release y desplegar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION"             --target "${{ github.sha }}"             --title "Detector de Anomalias NoSQL v$VERSION"             --generate-notes

      - name: Desplegar en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent             --request POST             "$RENDER_DEPLOY_HOOK_URL"

      - name: Generar reporte de despliegue
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "# Reporte de Release y Despliegue" > reporte-release.md
          echo "" >> reporte-release.md
          echo "- Version: v$VERSION" >> reporte-release.md
          echo "- Commit: ${{ github.sha }}" >> reporte-release.md
          echo "- Rama: ${{ github.ref_name }}" >> reporte-release.md
          echo "- Estado del workflow: COMPLETADO" >> reporte-release.md
          echo "- Destino: Render" >> reporte-release.md

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-release-v${{ inputs.version }}
          path: reporte-release.md
          retention-days: 30
