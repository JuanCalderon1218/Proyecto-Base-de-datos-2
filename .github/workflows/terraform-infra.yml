name: Terraform infraestructura y costos

on:
  workflow_dispatch:
    inputs:
      apply_infrastructure:
        description: "Crear el recurso Render Key Value Free (USD 0/mes)"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"

permissions:
  contents: read
  actions: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Recuperar estado Terraform anterior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow terraform-infra.yml --branch main --status success --limit 2 --json databaseId --jq '.[1].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --name terraform-state -D .
          else
            echo "No existe estado previo; se inicializa un estado nuevo."
          fi

      - name: Terraform fmt
        run: |
          terraform fmt -recursive
          terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Generar reporte de pruebas
        run: |
          echo "# Reporte de pruebas Terraform" > ../../reporte-terraform.md
          echo "" >> ../../reporte-terraform.md
          echo "- terraform fmt: SUPERADO" >> ../../reporte-terraform.md
          echo "- terraform init: SUPERADO" >> ../../reporte-terraform.md
          echo "- terraform validate: SUPERADO" >> ../../reporte-terraform.md
          echo "- Recurso: Render Key Value Free" >> ../../reporte-terraform.md
          echo "- Commit: ${{ github.sha }}" >> ../../reporte-terraform.md

      - name: Generar reporte de costos
        run: |
          echo "# Reporte de costos estimados" > ../../reporte-costos.md
          echo "" >> ../../reporte-costos.md
          echo "- Render Key Value Free: USD 0/mes." >> ../../reporte-costos.md
          echo "- Limites: 25 MB RAM y 50 conexiones." >> ../../reporte-costos.md
          echo "- Render Web Service existente: se mantiene en su plan actual Free." >> ../../reporte-costos.md
          echo "- MongoDB Atlas: servicio externo existente; no se crea ni modifica." >> ../../reporte-costos.md
          echo "- GitHub Actions: sujeto a los minutos incluidos en el plan de GitHub." >> ../../reporte-costos.md

      - name: Terraform plan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_infrastructure == true }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_infrastructure == true }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
        run: |
          terraform apply -auto-approve tfplan
          terraform state pull > terraform.tfstate

      - name: Subir estado Terraform
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_infrastructure == true }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: infra/terraform/terraform.tfstate
          retention-days: 90

      - name: Subir reportes
        uses: actions/upload-artifact@v4
        with:
          name: reportes-terraform-${{ github.run_number }}
          path: |
            reporte-terraform.md
            reporte-costos.md
          retention-days: 30
