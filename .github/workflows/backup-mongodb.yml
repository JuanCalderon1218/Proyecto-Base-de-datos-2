name: Backup automatico MongoDB

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pymongo dnspython

      - name: Generar backup de MongoDB Atlas
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python - <<'PY'
          import os
          import gzip
          from pathlib import Path
          from datetime import datetime, timezone

          from pymongo import MongoClient
          from bson.json_util import dumps

          client = MongoClient(os.environ["MONGO_URI"])
          client.admin.command("ping")

          carpeta = Path("backup")
          carpeta.mkdir(exist_ok=True)

          ignorar = {"admin", "local", "config"}
          bases = [
              db for db in client.list_database_names()
              if db not in ignorar
          ]

          reporte = [
              "# Reporte de Backup MongoDB",
              "",
              f"Fecha UTC: {datetime.now(timezone.utc)}",
              "Estado: COMPLETADO",
              "",
              "Bases respaldadas:"
          ]

          for nombre_bd in bases:
              db = client[nombre_bd]
              carpeta_bd = carpeta / nombre_bd
              carpeta_bd.mkdir(exist_ok=True)

              for coleccion in db.list_collection_names():
                  documentos = list(db[coleccion].find({}))

                  archivo = carpeta_bd / f"{coleccion}.json.gz"

                  with gzip.open(
                      archivo,
                      "wt",
                      encoding="utf-8"
                  ) as f:
                      f.write(dumps(documentos))

                  reporte.append(
                      f"- {nombre_bd}.{coleccion}: "
                      f"{len(documentos)} documentos"
                  )

          (carpeta / "reporte.md").write_text(
              "\n".join(reporte),
              encoding="utf-8"
          )

          print("Backup completado correctamente")
          PY

      - name: Subir respaldo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-${{ github.run_number }}
          path: backup/
          retention-days: 30
