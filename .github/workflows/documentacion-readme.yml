name: Documentacion automatica README

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/generate_project_readme.py"

permissions:
  contents: write

jobs:
  generar-documentacion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar README y reporte
        run: python scripts/generate_project_readme.py

      - name: Guardar documentacion generada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md reporte-documentacion.md
          if git diff --cached --quiet; then
            echo "No hay cambios en la documentacion"
          else
            git commit -m "docs: actualizar README y diagramas automaticamente"
            git push
          fi

      - name: Subir reporte como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-documentacion-${{ github.run_number }}
          path: reporte-documentacion.md
          retention-days: 30
