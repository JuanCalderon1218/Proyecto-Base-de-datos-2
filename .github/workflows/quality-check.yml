name: Calidad de codigo Python

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/quality-check.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar sintaxis
        run: python -m compileall -q backend scripts tests

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v

      - name: Generar reporte
        run: |
          {
            echo "# Reporte de calidad Python"
            echo
            echo "- Compilacion de sintaxis: SUPERADA"
            echo "- Pruebas unitarias: SUPERADAS"
            echo "- Python: 3.12"
            echo "- Commit: ${{ github.sha }}"
          } > reporte-calidad-python.md

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-calidad-python-${{ github.run_number }}
          path: reporte-calidad-python.md
          retention-days: 30
